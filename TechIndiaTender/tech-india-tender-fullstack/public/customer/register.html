<!doctype html><html><head><meta charset="utf-8"><title>Register | Tech India Tender</title><link rel="stylesheet" href="/assets/style.css"></head><body><section class="section"><div class="container" style="max-width:620px"><div class="form-card"><div id="registerStep"><h2>Create Customer Account</h2><br><form id="registerForm"><div class="grid grid-2"><div class="field"><label>Full Name</label><input name="full_name" required></div><div class="field"><label>Mobile Number</label><input name="phone" required></div></div><div class="field"><label>Email Address</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="grid grid-2"><div class="field"><label>Business Name</label><input name="business_name"></div><div class="field"><label>Business Type</label><select name="business_type"><option>Manufacturer</option><option>Trader</option><option>Service Provider</option><option>MSME</option></select></div></div><button class="btn btn-gold btn-block">Register & Send OTP</button></form></div><div id="verifyStep" class="hidden"><h2>Verify OTP</h2><p class="mini">OTP sent to your registered mobile number and email.</p><br><form id="verifyForm"><div class="field"><label>Enter OTP</label><input name="otp" required maxlength="6"></div><button class="btn btn-gold btn-block">Verify Account</button></form></div></div></div></section><script src="/assets/app.js"></script></body></html>
